</style></head><body><div class="wrap"><header><h1>MAGIST PRO · M111</h1><p>Исабаева Г.М. «Азық-түлік өнімдері салаларының технологиясы» · 1–29-тараулар</p></header><nav class="chapter-index" id="chapter-index" aria-label="Тараулар"></nav><main id="chapters"></main></div><button class="up" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Жоғары">↑</button><script>
const SECTIONS=[{"title": "1-тарау. Ет, субөнімдер мен қанның құрамы және тағамдық құндылығы", "questions": [{"q": "Малды тасымалдауға жіберу кезінде ветеринариялық куәліктің жарамдылық мерзімі қандай?", "o": ["3 күн", "5 күн", "7 күн", "1 күн", "2 күн"], "a": 0, "e": "12-бет: ветеринариялық куәлік үш күнге жарамды."}, {"q": "Малды сою алдында тасымалдаудың азықтандыру режиміне көшіру мерзімі қандай?", "o": ["10–11 тәулік бұрын", "2–3 тәулік бұрын", "7–8 тәулік бұрын", "12–13 тәулік бұрын", "4–5 тәулік бұрын"], "a": 2, "e": "12-бет: тасымалдаудан 7–8 тәулік бұрын арнайы азықтандыру режиміне көшіріледі."}, {"q": "Малды тасымалдау кезінде тірі салмақтың төмендеуіне көбірек ықпал ететін фактор қандай?", "o": ["Тасымалдау уақытының ұзақтығы", "Тасымалдау торының пішіні", "Тасымалдау бағытының атауы", "Тасымалдау құжатының саны", "Тасымалдау көлігінің түсі"], "a": 0, "e": "12-бет: тірі салмақ жоғалтудың негізгі факторы - тасымалдау ұзақтығы."}, {"q": "Сойылған малдың ішкі ағзаларын қан ағызғаннан кейін қанша уақыттан кешіктірмей алу қажет?", "o": ["45 минуттан кешіктірмей", "30 минуттан кешіктірмей", "60 минуттан кешіктірмей", "15 минуттан кешіктірмей", "90 минуттан кешіктірмей"], "a": 0, "e": "13-бет: ішкі ағзалар қан ағызылған соң 45 минуттан асырмай алынады."}, {"q": "Еттің технологиялық құрамындағы бұлшық ет ұлпасының үлесі қандай аралықта көрсетілген?", "o": ["30–50 %", "70–90 %", "50–70 %", "20–40 %", "60–80 %"], "a": 2, "e": "15-бет: бұлшық ет ұлпасының үлесі 50–70 %."}, {"q": "Еттің технологиялық құрамындағы сүйек ұлпасының үлесі қандай?", "o": ["20–27 %", "10–17 %", "15–22 %", "5–12 %", "25–32 %"], "a": 2, "e": "15-бет: сүйек ұлпасының үлесі 15–22 %."}, {"q": "Ет ақуызының сапалық көрсеткіші қандай екі заттың қатынасымен анықталады?", "o": ["Лейцин мен валиннің қатынасымен", "Триптофан мен оксипролиннің қатынасымен", "Глицин мен аланиннің қатынасымен", "Лизин мен метиониннің қатынасымен", "Тирозин мен пролиннің қатынасымен"], "a": 1, "e": "16-бет: көрсеткіш триптофанның оксипролинге қатынасымен бағаланады."}, {"q": "Еттің қызыл түсінің қарқындылығы қандай факторға байланысты?", "o": ["Лактоза мөлшері мен казеин күйіне", "Целлюлоза мөлшері мен лигнин күйіне", "Коллаген мөлшері мен эластин күйіне", "Крахмал мөлшері мен пектин күйіне", "Миоглобин мөлшері мен глобин күйіне"], "a": 4, "e": "17-бет: түс миоглобин концентрациясы мен глобин күйіне байланысты."}, {"q": "бірінші санаттағы субөнімдер жұбы қайсы?", "o": ["Бас пен қарын", "Ұлтабар мен таңдай", "Қарын мен ерін", "Өкпе мен құлақ", "Тіл мен бауыр"], "a": 4, "e": "17-бет: тіл мен бауыр бірінші санатқа жатады."}, {"q": "Еттің құрылымдық толық емес ақуыздарына қандай жұп жатады?", "o": ["Тропонин мен тропомиозин", "Миоглобин мен гемоглобин", "Коллаген мен эластин", "Альбумин мен глобулин", "Актин мен миозин"], "a": 2, "e": "22-бет: коллаген мен эластин толық емес ақуыздар ретінде сипатталады."}]}, {"title": "2-тарау. Мал етін өңдеу", "questions": [{"q": "Мал сою және бастапқы өңдеу операцияларының дұрыс реті қайсы?", "o": ["Терісін алу, есінен тандыру, қан ағызу, ішкі ағзаларын алу", "Есінен тандыру, қан ағызу, терісін алу, ішкі ағзаларын алу", "Есінен тандыру, ішкі ағзаларын алу, терісін алу, қан ағызу", "Ішкі ағзаларын алу, қан ағызу, есінен тандыру, терісін алу", "Қан ағызу, есінен тандыру, ішкі ағзаларын алу, терісін алу"], "a": 1, "e": "28–29-беттер: союдың негізгі кезеңдері осы ретпен жүргізіледі."}, {"q": "Етті тұздау кезінде ас тұзының консервілеуші әсері немен байланысты?", "o": ["Ұлпадағы суды толық мұздатумен", "Майдың барлық түрін бірден ерітумен", "Автолиз бен шіру үдерістерін баяулатумен", "Ақуыздың барлық түрін толық ыдыратумен", "Еттегі пигменттерді толық жоюмен"], "a": 2, "e": "29-бет: тұз автолиз және шіру үдерістерін баяулатады."}, {"q": "Өндірістік тұздаудың қандай үш әдісі қолданылады?", "o": ["Құрғақ, булап және қуырып", "Аралас, ыстап және стерильдеп", "Құрғақ, тұздықпен және аралас", "Құрғақ, сәулелеп және пастерлеп", "Тұздықпен, кептіріп және мұздаты const answers={},finished={},modes={};

 const mode=modes[c]||'quiz',k=stateKey(c),selected=answers[k]||{},done=!!finished[k],qs=SECTIONS[c].questions;

}
